# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - gerador-de-certificados-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore src/Api/GeradorCertificado.Api.csproj

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply ORM migrations to AzureSQL
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: dotnet ef database update `
         --project src/Infra/GeradorCertificado.Infra.csproj `
         --startup-project src/Api/GeradorCertificado.Api.csproj `
         --configuration Release `
         --connection "$env:AZURE_SQL_CONNECTION_STRING"
 
  deploy:
    runs-on: windows-latest
    needs: [build, migrate]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C21EC8B7840247A581B466282F88D494 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_40323A6711E5424F8DAEE18229EE2453 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EC0F9CE2F3374D3FB3764CF04D5EFDA5 }}

      - name: Configure Azure Web AppSettings
        shell: pwsh
        run: |
          az webapp config appsettings set `
          --name gerador-de-certificados-2026 `
          --resource-group "gerador-de-certificados-fullstack" `
          --settings `
           NewRelic__LicenseKey=${{ secrets.NEWRELIC_LICENSE_KEY }} `
           ConnectionStrings__AzureSQL=${{ secrets.AZURESQL_CONNECTION_STRING }} `
           ConnectionStrings__RabbitMq=${{ secrets.RABBITMQ_CONNECTIONSTRING }} `
           LuckyPenny__Licensekey=${{ secrets.LUCKYPENNY_LICENSE_KEY }} `
           jwt__Key=${{ secrets.JWT_KEY }} `


      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gerador-de-certificados-2026'
          slot-name: 'Production'
          package: .
          