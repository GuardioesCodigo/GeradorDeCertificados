name: Build and deploy ASP.NET Core app to Azure Web App - gerador-de-certificados-2026

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.x"
  SOLUTION_FILE: "server/GeradorCertificado.slnx"
  API_PROJECT: "server/src/Api/GeradorCertificado.Api.csproj"
  INFRA_PROJECT: "server/src/Infra/GeradorCertificado.Infra.csproj"
  APP_NAME: "gerador-de-certificados-2026"

jobs:
  # 1. Testes automatizados
  test:
    name: Testes
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verificar solução
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.SOLUTION_FILE }}")) {
            Get-ChildItem -Path . -Recurse -Include *.sln,*.slnx,*.csproj |
              Select-Object -ExpandProperty FullName
            throw "Solução não encontrada: ${{ env.SOLUTION_FILE }}"
          }

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Test
        run: >
          dotnet test "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore

  # 2. Compilação e publicação
  build:
    name: Build e Publish
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do Angular
        working-directory: client
        run: npm ci

      - name: Compilar Angular
        working-directory: client
        run: npm run build -- --configuration production

      - name: Build solution
        run: >
          dotnet build "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-restore

      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore
          --output ./publish

      - name: Copiar Angular para wwwroot
        shell: pwsh
        run: |
          $source = "client/dist/gerador-certificados/browser"
          $destination = "publish/wwwroot"

          if (-not (Test-Path "$source/index.html")) {
            throw "Build Angular inválido: index.html não encontrado em $source"
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item "$source/*" -Destination $destination -Recurse -Force
          if (-not (Test-Path "$destination/index.html")) {
            throw "Falha ao copiar o Angular para wwwroot"
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

           
      - name: Integrar front-end ao pacote da API
        shell: pwsh
        run: |
          $frontendPath = Join-Path $PWD "client/dist/gerador-certificados/browser"
          $wwwroot = Join-Path $PWD "publish/wwwroot"

          if (-not (Test-Path (Join-Path $frontendPath "index.html"))) {
            throw "Build Angular inválido: index.html não encontrado em $frontendPath"
          }

          New-Item -ItemType Directory -Path $wwwroot -Force | Out-Null

          Copy-Item `
            -Path "$frontendPath/*" `
            -Destination $wwwroot `
            -Recurse `
            -Force

          $browserIndex = $indexFiles |
            Where-Object { $_.Directory.Name -eq "browser" } |
            Select-Object -First 1

          if ($browserIndex) {
            $frontendPath = $browserIndex.Directory.FullName
          } else {
            $frontendPath = $indexFiles[0].Directory.FullName
          }

          $wwwroot = Join-Path $PWD "publish/wwwroot"

          New-Item -ItemType Directory -Path $wwwroot -Force | Out-Null

          Copy-Item `
            -Path "$frontendPath/*" `
            -Destination $wwwroot `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $wwwroot "index.html"))) {
            throw "O frontend não foi integrado ao pacote publicado"
          }

          Write-Host "Angular integrado com sucesso em $wwwroot"

  # 3. Migrações do SQL Server
  migrate:
    name: Migrations SQL Server
    runs-on: windows-latest
    needs: build

    env:
      ConnectionStrings__AzureSQL: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validar connection string
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__AzureSQL)) {
            throw "O secret AZURE_SQL_CONNECTION_STRING não foi configurado."
          }

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Install Entity Framework CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          dotnet ef --version

      - name: Build API
        run: >
          dotnet build "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore

      - name: Apply EF Core migrations
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          dotnet ef database update `
            --project "${{ env.INFRA_PROJECT }}" `
            --startup-project "${{ env.API_PROJECT }}" `
            --configuration Release `
            --no-build

  # 4. Configuração do Azure e deploy
  deploy:
    name: Configurar Azure e Deploy
    runs-on: windows-latest
    needs:
      - build
      - migrate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C21EC8B7840247A581B466282F88D494 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_40323A6711E5424F8DAEE18229EE2453 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EC0F9CE2F3374D3FB3764CF04D5EFDA5 }}

      - name: Configure Azure App Settings
        shell: pwsh
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          STORAGE_PATH: ${{ vars.STORAGE_PATH }}
        run: |
          $settings = @{
            "ConnectionStrings__AzureSQL" = $env:AZURE_SQL_CONNECTION_STRING
            "Jwt__Key" = $env:JWT_KEY
            "Jwt__Issuer" = "geradorCertificado-app-api"
            "Jwt__Audience" = "geradorCertificado-app-client"
            "NewRelic__Enabled" = "true"
            "NewRelic__EndpointUrl" = "https://log-api.newrelic.com/log/v1"
            "NewRelic__ApplicationName" = "geradorCertificado-app-prod"
            "NewRelic__LicenseKey" = $env:NEW_RELIC_LICENSE_KEY
          }

          # Origem do client (Azure Static Web Apps) liberada via CORS na API.
          if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_URL)) {
            $settings["Cors__AllowedOrigins__0"] = $env:CLIENT_URL.Trim().TrimEnd('/')
          }

          # Pasta persistente para os PDFs/ZIPs (ex.: D:\home\Arquivos no Windows, /home/Arquivos no Linux).
          if (-not [string]::IsNullOrWhiteSpace($env:STORAGE_PATH)) {
            $settings["Armazenamento__CaminhoBase"] = $env:STORAGE_PATH.Trim()
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
            throw "AZURE_SQL_CONNECTION_STRING não foi configurado."
          }

          if ([string]::IsNullOrWhiteSpace($env:JWT_KEY)) {
            throw "JWT_KEY não foi configurado."
          }

          $settingsFile = Join-Path $env:RUNNER_TEMP "azure-appsettings.json"

          try {
            $settings |
              ConvertTo-Json |
              Set-Content -Path $settingsFile -Encoding utf8

            az webapp config appsettings set `
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
              --name "${{ env.APP_NAME }}" `
              --settings "@$settingsFile" `
              --output none

            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao configurar as variáveis do Azure App Service."
            }
          }
          finally {
            Remove-Item $settingsFile -Force -ErrorAction SilentlyContinue
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ./publish

