services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gerador-certificado-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SenhaForte#2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - gerador-certificado-sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gerador-certificado-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Painel de administração (http://localhost:15672)

volumes:
  gerador-certificado-sqlserver-data:
