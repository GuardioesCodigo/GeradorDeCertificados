services:
  postgres:
    image: postgres:16-alpine
    container_name: gerador-certificado-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: GeradorCertificadoAppDb
    ports:
      - "5432:5432"
    volumes:
      - gerador-certificado-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gerador-certificado-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Painel de administração (http://localhost:15672)

volumes:
  gerador-certificado-postgres-data:
